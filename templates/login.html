{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <div class="form-container">
        <h2 class="mb-4">Log In</h2>
        
        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input class="form-control" id="username" autocomplete="username" autofocus name="username" placeholder="Enter your username" type="text" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" id="password" autocomplete="current-password" name="password" placeholder="Enter your password" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log In</button>
        </form>
        
        <p class="mt-3 text-center text-muted">
            Don't have an account? <a href="/register">Register here</a>
        </p>
    </div>
{% endblock %}
