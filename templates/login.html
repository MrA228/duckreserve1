{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <div class="form-container">
        <h2 class="mb-4">{{ _("Log In") }}</h2>
        
        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">{{ _("Username") }}</label>
                <input class="form-control" id="username" autocomplete="username" autofocus name="username" placeholder="{{ _('Enter your username') }}" type="text" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">{{ _("Password") }}</label>
                <input class="form-control" id="password" autocomplete="current-password" name="password" placeholder="{{ _('Enter your password') }}" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">{{ _("Log In") }}</button>
        </form>
        
        <p class="mt-3 text-center text-muted">
            {{ _("Don't have an account?") }} <a href="/register">{{ _("Register here") }}</a>
        </p>
    </div>
{% endblock %}
