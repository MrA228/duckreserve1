{% extends "layout.html" %}

{% block title %}
    {{ room.name }}
{% endblock %}

{% block main %}
    <div class="text-center mb-4">
        <h1>{{ room.name }} {{ _("Room") }}</h1>
        <p class="text-muted">{{ _("Click on a table to see available time slots.") }}</p>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            {% for table in tables %}
                <div class="col-md-4 col-sm-6 col-12 mb-4"> 
                    <a href="/table/{{ table.id }}" style="text-decoration: none;">
                        <div class="table-card p-4 text-center">
                            <h5 class="mb-2">{{ table.name }}</h5>
                            <span class="text-muted" style="font-size: 0.9rem;">
                                {{ _("View Available Times") }} →
                            </span>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>

{% endblock %}
