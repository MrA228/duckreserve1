{% extends "layout.html" %}

{% block title %}
    Registration
{% endblock %}

{% block main %}

    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus name="username" placeholder="Login" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus name="password" placeholder="Password" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus name="confirmation" placeholder="Type your password again" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>


{% endblock %}
