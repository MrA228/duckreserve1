{% extends "layout.html" %}

{% block title %}
    Registration
{% endblock %}

{% block main %}

    {% if error %}
    <div class="alert alert-danger text-center">
        {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus name="username" placeholder="Login" type="text" required>
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus name="password" placeholder="Password" type="text" required>
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus name="confirmation" placeholder="Type your password again" type="text" required>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>


{% endblock %}
